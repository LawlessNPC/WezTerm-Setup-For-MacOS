# ==========================================================================
# Liquid Glass status bar  (dark; matches wezterm/themes/glass.lua)
#   palette: label #F5F5F7  secondary #8E8E93  fill #3A3A3C  fill-soft #2C2C2E
#            blue #0A84FF  orange #FF9F0A  yellow #FFD60A  purple #BF5AF2
#   bg=default everywhere so WezTerm's blurred glass shows through; only
#   pills get a fill. Pill caps / icons come from Symbols Nerd Font.
#   Inside #{?...} conditionals colours are written ##RRGGBB so tmux
#   doesn't read #F / #B as format aliases.
# ==========================================================================
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#8E8E93"

# Mode pill colour: blue Normal, orange Prefix, yellow Copy, purple Zoom.
set -g @glass_mode_bg "#{?client_prefix,##FF9F0A,#{?pane_in_mode,##FFD60A,#{?window_zoomed_flag,##BF5AF2,##0A84FF}}}"
set -g @glass_mode_fg "#{?#{||:#{client_prefix},#{pane_in_mode}},##1C1C1E,##FFFFFF}"
set -g @glass_mode_text "#{?client_prefix,Prefix,#{?pane_in_mode,Copy,#{?window_zoomed_flag,Zoom,Normal}}}"

# --- left: mode pill + privacy-safe context ------------------------------
set -g status-left-length 110
set -g status-left "#[fg=#{E:@glass_mode_bg},bg=default]#[fg=#{E:@glass_mode_fg},bg=#{E:@glass_mode_bg},bold] #{E:@glass_mode_text} #[fg=#{E:@glass_mode_bg},bg=default,nobold]  #[fg=#8E8E93] #($HOME/.tmux/status/context.sh '#{pane_current_path}')   "

# --- windows: plain grey text, active one floats in a pill ---------------
# Both formats are the same width so the bar doesn't shift on switch.
set -g window-status-separator ""
set -g window-status-format "#[fg=#8E8E93,bg=default]  #I #W  "
set -g window-status-current-format "#[fg=#3A3A3C,bg=default]#[fg=#F5F5F7,bg=#3A3A3C,bold] #I #W #[fg=#3A3A3C,bg=default,nobold]"
set -g window-status-activity-style "fg=#FFD60A,bg=default"

# --- right: quiet system info + date/time pill ---------------------------
set -g status-right-length 140
# System info only when the client is wide enough; otherwise left + right
# fill the bar and tmux drops the window list entirely.
set -g status-right "#[fg=#8E8E93,bg=default]#{?#{e|>=:#{client_width},150},#($HOME/.tmux/status/disk.sh)  ·  #($HOME/.tmux/status/load.sh)  ·  Windows: #{session_windows}  Panes: #{window_panes}  ,}#[fg=#3A3A3C]#[fg=#F5F5F7,bg=#3A3A3C] %a %d %b  #[bold]%I:%M %p #[fg=#3A3A3C,bg=default,nobold]"

# --- pane borders / messages / modes -------------------------------------
set -g pane-border-style "fg=#2C2C2E"
set -g pane-active-border-style "fg=#48484A"
set -g message-style "bg=#2C2C2E,fg=#F5F5F7"
set -g message-command-style "bg=#2C2C2E,fg=#0A84FF"
set -g mode-style "bg=#0A4A8F,fg=#FFFFFF"
set -g clock-mode-colour "#0A84FF"

# Dim inactive panes, keep the focused one crisp (mirrors WezTerm).
set -g window-style "fg=#8E8E93,bg=default"
set -g window-active-style "fg=#F5F5F7,bg=default"
